name: Publish NPM Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npmjs registry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup-js

      - name: Store auth token in config file
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # npm, not yarn: yarn 1 publishes against registry.yarnpkg.com, which the
      # auth line above does not cover, and a scoped package that does not exist
      # yet then reads back as 404. npm honours publishConfig.access.
      - name: npm publish
        run: npm publish
        working-directory: javascript
